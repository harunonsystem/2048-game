name: "Test and Build"
description: "Run TypeScript checks, tests, and build the project"

inputs:
  skip-tests:
    description: "Skip running tests (useful for deploy-only jobs)"
    required: false
    default: "false"
  run-e2e:
    description: "Run E2E tests with Playwright"
    required: false
    default: "false"
  umami-website-id:
    description: "Umami website ID to embed in the production build"
    required: false
    default: ""

outputs:
  build-success:
    description: "Whether build was successful"
    value: ${{ steps.build.outcome }}

runs:
  using: "composite"
  steps:
    - name: Run TypeScript check
      shell: bash
      run: pnpm typecheck

    - name: Run tests
      if: inputs.skip-tests != 'true'
      shell: bash
      run: pnpm test:run

    - name: Build project
      id: build
      shell: bash
      env:
        VITE_UMAMI_WEBSITE_ID_2048_GAME: ${{ inputs.umami-website-id }}
      run: pnpm build

    - name: Install Playwright Browsers
      if: inputs.run-e2e == 'true'
      shell: bash
      run: pnpm exec playwright install chromium

    - name: Run E2E tests
      if: inputs.run-e2e == 'true'
      shell: bash
      run: pnpm test:e2e:chrome
